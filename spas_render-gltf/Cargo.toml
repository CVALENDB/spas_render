[package]
name = "spas_render-gltf"
version = "0.3.0"
authors = ["The spas_render Developers", "CVALENDB"]
edition = "2021"
description = "gltf scene and model loader for the spas_render rendering library."
readme = "../README.md"
repository = "https://github.com/CVALENDB/spas_render"
license = "MIT OR Apache-2.0 OR Zlib"
keywords = ["3d", "graphics", "spas_render", "gltf", "wgpu"]
categories = ["game-development", "graphics", "rendering", "rendering::engine", "wasm"]
rust-version = "1.71"

[features]
default = ["ddsfile", "ktx2"]

[dependencies]
arrayvec = "0.7"
base64 = "0.23.1"
bytemuck = "1"
ddsfile = { version = "0.6.0", optional = true }
float-ord = "0.3.2"
glam = "0.34.3"
gltf = { version = "1.0", default-features = false, features = ["KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_unlit", "extras", "names", "utils"] }
image = { version = "0.25.10", default-features = false }
ktx2 = { version = "0.5.0", optional = true }
log = "0.4"
profiling = {version = "1", default-features = false }
spas_render = { version = "^0.3.0", path = "../spas_render" }
spas_render-routine = { version = "^0.3.0", path = "../spas_render-routine" }
thiserror = "2.0.21"

[dev-dependencies]
pollster = "1.0.3"
