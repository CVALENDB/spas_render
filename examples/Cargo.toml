[package]
name = "spas_render-examples-package"
license = "MIT OR Apache-2.0 OR Zlib"
version = "0.3.0"
authors = ["The spas_render Developers", "CVALENDB"]
repository = "https://github.com/CVALENDB/spas_render"
edition = "2021"
publish = false
rust-version = "1.71"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "spas_render-examples"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# error handling
anyhow = "1"
# The egui immediate mode gui library
egui = "0.37.0"
# Winit integration with egui (turn off the clipboard feature)
egui-winit = { version = "0.37.0", default-features = false, features = ["links", "wayland"] }
# logging
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# Linear algebra library
glam = "0.34.3"
# gltf model loading
gltf = "1.4"
# Channel
flume = "0.12.0"
# Logging infrastructure
log = "0.4"
# Inline string
indoc = "2"
# Importing images
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
] }
# profiling
profiling = "1"
# argument parsing
pico-args = "0.5"
# block on async functions
pollster = "1.0.3"
# Renderer core
spas_render = { version = "^0.3.0", path = "../spas_render" }
# Play animations on imported gltf models
spas_render-anim = { version = "^0.3.0", path = "../spas_render-anim" }
# Egui integration with spas_render
spas_render-egui = { version = "^0.3.0", path = "../spas_render-egui" }
# Programmable render list that dictates how the scene renders
spas_render-routine = { version = "^0.3.0", path = "../spas_render-routine" }
# Framework that deals with the event loop, setting up the renderer, and platform differences.
spas_render-framework = { version = "^0.3.0", path = "../spas_render-framework" }
# Import gltf models
spas_render-gltf = { version = "^0.3.0", path = "../spas_render-gltf" }
# Opening URL's
webbrowser = "1.2.7"
# Instant but portable to the web
web-time = "1.1"
# windowing
winit = "0.30.13"
# Integration with wgpu
wgpu = "30.0.2"
# Profiling with wgpu
wgpu-profiler = "0.28.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
gloo-console = "0.4.1"
web-sys = "0.3.67"
wasm-bindgen = "0.2.83"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
ndk-glue = { version = "0.7", features = ["logger"] }

[dev-dependencies]
spas_render-test = { version = "^0.3.0", path = "../spas_render-test" }
tokio = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { version = "0.3" }

[package.metadata.android]
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 28
compile_sdk_version = 28
