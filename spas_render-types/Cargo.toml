[package]
name = "spas_render-types"
version = "0.3.0"
authors = ["The spas_render Developers", "CVALENDB"]
edition = "2021"
description = "Type definitions for the spas_render rendering library."
readme = "../README.md"
repository = "https://github.com/CVALENDB/spas_render"
license = "MIT OR Apache-2.0 OR Zlib"
keywords = ["3d", "graphics", "spas_render", "renderer", "wgpu"]
categories = ["game-development", "graphics", "rendering", "rendering::engine", "wasm"]
rust-version = "1.71"

[dependencies]
bitflags = "2"
bytemuck = { version = "1", features = ["min_const_generics"] }
cfg-if = "1"
encase = { version = "0.13.0" }
glam = { version = "0.34.3", features = ["bytemuck"] }
list-any = "0.2"
once_cell = "1"
thiserror = "2.0.21"
wgt = { package = "wgpu-types", version = "30.0.2" }
